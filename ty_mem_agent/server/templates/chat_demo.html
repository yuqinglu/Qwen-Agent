<!DOCTYPE html>
<html>
<head>
    <title>TY Memory Agent Chat Demo</title>
    <meta charset="UTF-8">
    <style>
        * {
            box-sizing: border-box;
        }
        
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .app-layout {
            display: flex;
            height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
            background: white;
        }
        
        /* 左侧会话列表面板 */
        .sidebar {
            width: 280px;
            background: #f7f9fc;
            border-right: 1px solid #e1e4e8;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
        }
        
        .sidebar.hidden {
            transform: translateX(-100%);
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e1e4e8;
            background: white;
        }
        
        .new-chat-btn {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .conversation-item {
            padding: 12px 15px;
            margin-bottom: 5px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .conversation-item:hover {
            background: #e8f0fe;
            transform: translateX(2px);
        }
        
        .conversation-item.active {
            background: #e8f0fe;
            border-color: #667eea;
        }
        
        .conversation-title {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .conversation-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #666;
        }
        
        .conversation-time {
            font-size: 11px;
            color: #999;
        }
        
        .conversation-delete {
            opacity: 0;
            color: #dc3545;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .conversation-item:hover .conversation-delete {
            opacity: 1;
        }
        
        .conversation-delete:hover {
            background: #dc3545;
            color: white;
        }
        
        /* 时间分组样式 */
        .time-group {
            margin-bottom: 20px;
        }
        
        .time-group-header {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding: 0 20px;
            position: sticky;
            top: 0;
            background: #f7f9fc;
            z-index: 10;
            padding-top: 10px;
            padding-bottom: 5px;
        }
        
        .time-group-content {
            padding: 0 10px;
        }
        
        .time-group-content .conversation-item {
            margin-bottom: 8px;
        }
        
        /* 主聊天区域 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .container { 
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white; 
            overflow: hidden;
        }
        .header { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            padding: 20px; 
        }
        .header-content {
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-left {
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            align-items: center;
        }
        .title-section {
            text-align: left;
        }
        .header h1 { margin: 0; font-size: 2em; }
        .header p { margin: 10px 0 0 0; opacity: 0.9; }
        
        .auth-form { 
            padding: 30px; 
            border-bottom: 1px solid #eee; 
        }
        .auth-form h3 { 
            margin-top: 0; 
            color: #333; 
            text-align: center;
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        .form-group label { 
            display: block; 
            margin-bottom: 5px; 
            color: #555; 
            font-weight: 500;
        }
        .form-group input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-group { 
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex; 
            gap: 10px; 
            margin-top: 20px;
        }
        button { 
            -webkit-flex: 1;
            -ms-flex: 1;
            flex: 1;
            padding: 12px 20px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 500;
            -webkit-transition: all 0.3s;
            -moz-transition: all 0.3s;
            -ms-transition: all 0.3s;
            -o-transition: all 0.3s;
            transition: all 0.3s;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
        }
        .btn-primary:hover { 
            -webkit-transform: translateY(-2px);
            -moz-transform: translateY(-2px);
            -ms-transform: translateY(-2px);
            -o-transform: translateY(-2px);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary { 
            background: #6c757d; 
            color: white; 
        }
        .btn-secondary:hover { 
            background: #5a6268; 
        }
        .btn-link {
            background: none;
            color: #667eea;
            padding: 5px;
            text-decoration: underline;
            font-size: 13px;
        }
        .btn-link:hover {
            color: #764ba2;
        }
        
        .chat-container { 
            flex: 1;
            overflow-y: auto; 
            padding: 20px; 
            background: #f8f9fa;
        }
        .message { 
            margin-bottom: 15px; 
            padding: 12px; 
            border-radius: 8px; 
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message { 
            background: #e3f2fd; 
            margin-left: 50px;
            border-left: 3px solid #2196F3;
        }
        .assistant-message { 
            background: #f3e5f5; 
            margin-right: 50px;
            border-left: 3px solid #9C27B0;
        }
        /* 思考过程样式 - 淡色、小字体 */
        .thinking-message {
            background: #f8f9fa;
            margin-right: 50px;
            margin-bottom: 8px;
            padding: 8px 12px;
            border-left: 2px solid #dee2e6;
            opacity: 0.7;
            font-size: 0.85em;
            color: #6c757d;
            font-style: italic;
        }
        .thinking-message .message-content {
            line-height: 1.3;
        }
        .thinking-message .message-time {
            font-size: 0.75em;
            color: #adb5bd;
        }
        /* 最终回答样式 - 突出显示 */
        .final-answer {
            background: #f3e5f5;
            margin-right: 50px;
            border-left: 3px solid #9C27B0;
            animation: fadeInUp 0.4s;
        }
        @keyframes fadeInUp {
            from { 
                opacity: 0; 
                transform: translateY(15px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        .input-container { 
            padding: 20px; 
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex; 
            gap: 10px; 
            background: #f8f9fa;
        }
        input[type="text"] { 
            -webkit-flex: 1;
            -ms-flex: 1;
            flex: 1; 
            min-width: 0; /* 确保输入框可以收缩 */
        }
        .send-button {
            width: 60px !important; /* 更窄的固定宽度，使用!important确保优先级 */
            flex: none !important; /* 覆盖通用button的flex: 1 */
            flex-shrink: 0; /* 防止收缩 */
            font-size: 13px; /* 稍微小一点的字体 */
            padding: 10px 8px; /* 调整内边距 */
        }
        .status { 
            color: #666; 
            font-style: italic; 
            text-align: center;
            padding: 10px;
        }
        .error { 
            color: #dc3545; 
            background: #f8d7da;
            border-left: 3px solid #dc3545;
        }
        .success {
            color: #28a745;
            background: #d4edda;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }
        .message-content { 
            word-wrap: break-word; 
            white-space: pre-wrap; 
            line-height: 1.5;
        }
        .message-time { 
            color: #999; 
            font-size: 0.8em; 
            margin-top: 5px;
            display: block;
        }
        .form-footer {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 13px;
        }
        .default-users {
            background: #e7f3ff;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 13px;
            color: #0066cc;
        }
        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        
        /* 待办管理区域 */
        .todo-manager-area {
            position: absolute;
            top: 20px;
            right: 280px;
            z-index: 1000;
        }
        .todo-manager-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            -webkit-transition: all 0.3s;
            -moz-transition: all 0.3s;
            -ms-transition: all 0.3s;
            -o-transition: all 0.3s;
            transition: all 0.3s;
            min-width: 120px;
        }
        .todo-manager-btn:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
            -webkit-transform: translateY(-2px);
            -moz-transform: translateY(-2px);
            -ms-transform: translateY(-2px);
            -o-transform: translateY(-2px);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        /* 用户信息区域 */
        .user-info {
            position: absolute;
            top: 20px;
            right: 20px;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        .user-name {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .logout-btn:hover {
            background: #c82333;
            transform: translateY(-1px);
        }
        
        /* 空状态提示 */
        .empty-conversations {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .empty-conversations-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        /* 登录页面特殊布局 */
        .login-layout {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        
    </style>
</head>
<body>
    <!-- 登录页面（独立布局） -->
    <div class="login-layout" id="loginLayout">
        <div class="header">
            <div class="header-content">
                <div class="header-left">
                    <div class="title-section">
                        <h1>🤖 TY Memory Agent</h1>
                        <p>智能记忆助手演示</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 登录表单 -->
        <div class="auth-form" id="loginForm">
            <h3>登录到您的账户</h3>
            <div class="form-group">
                <label for="loginUsername">用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名" value="admin">
            </div>
            <div class="form-group">
                <label for="loginPassword">密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" value="admin123">
            </div>
            <div id="loginError" class="error-message"></div>
            <div class="btn-group">
                <button class="btn-primary" onclick="login()">登录</button>
            </div>
            <div class="form-footer">
                还没有账户？<button class="btn-link" onclick="showRegisterForm()">立即注册</button>
            </div>
            <div class="default-users">
                💡 默认测试账户: test/test123 或 admin/admin123
            </div>
        </div>
        
        <!-- 注册表单 -->
        <div class="auth-form" id="registerForm" style="display: none;">
            <h3>创建新账户</h3>
            <div class="form-group">
                <label for="registerUsername">用户名</label>
                <input type="text" id="registerUsername" placeholder="请输入用户名（3-20个字符）">
            </div>
            <div class="form-group">
                <label for="registerPassword">密码</label>
                <input type="password" id="registerPassword" placeholder="请输入密码（至少6个字符）">
            </div>
            <div class="form-group">
                <label for="registerPasswordConfirm">确认密码</label>
                <input type="password" id="registerPasswordConfirm" placeholder="请再次输入密码">
            </div>
            <div id="registerError" class="error-message"></div>
            <div id="registerSuccess" class="success" style="display: none;"></div>
            <div class="btn-group">
                <button class="btn-secondary" onclick="showLoginForm()">返回登录</button>
                <button class="btn-primary" onclick="register()">注册</button>
            </div>
        </div>
    </div>
    
    <!-- 主应用布局（聊天界面） -->
    <div class="app-layout" id="appLayout" style="display: none;">
        <!-- 左侧会话列表 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewConversation()">
                    ➕ 新建对话
                </button>
            </div>
            <div class="conversations-list" id="conversationsList">
                <div class="empty-conversations">
                    <div class="empty-conversations-icon">💬</div>
                    <div>还没有对话记录</div>
                    <div style="font-size: 12px; margin-top: 5px;">点击上方按钮开始新对话</div>
                </div>
            </div>
        </div>
        
        <!-- 主聊天区域 -->
        <div class="main-content">
            <!-- 待办管理按钮（独立区域） -->
            <div class="todo-manager-area" id="todoManagerArea">
                <button class="btn btn-primary todo-manager-btn" id="todoButton" onclick="openTodoPage()">📝 待办管理</button>
            </div>
            
            <!-- 用户信息区域（登录后显示） -->
            <div class="user-info" id="userInfo">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="user-name" id="userName">用户</div>
                <button class="logout-btn" onclick="logout()">登出</button>
            </div>
            
            <div class="container">
                <div class="header">
                    <div class="header-content">
                        <div class="header-left">
                            <div class="title-section">
                                <h1>🤖 TY Memory Agent</h1>
                                <p id="currentConversationTitle">智能记忆助手</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 聊天容器 -->
                <div class="chat-container" id="chatContainer"></div>
                
                <!-- 输入容器 -->
                <div class="input-container" id="inputContainer">
                    <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
                    <button class="btn-primary send-button" onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let token = null;
        let currentConversationId = null;  // 当前会话ID
        let conversations = [];  // 会话列表

        // 统一的认证错误处理
        function handleAuthError(response) {
            if (response && (response.status === 401 || response.status === 403)) {
                console.warn('🔒 令牌已过期，正在跳转到登录页面...');
                // 清理本地存储
                localStorage.removeItem('access_token');
                localStorage.removeItem('userInfo');
                
                // 关闭WebSocket连接
                if (ws) {
                    ws.close();
                    ws = null;
                }
                
                // 重置状态
                token = null;
                currentConversationId = null;
                conversations = [];
                
                // 切换到登录界面
                document.getElementById('appLayout').style.display = 'none';
                document.getElementById('loginLayout').style.display = 'block';
                
                // 清空聊天窗口
                document.getElementById('chatContainer').innerHTML = '';
                
                // 显示提示消息
                const errorDiv = document.getElementById('loginError');
                errorDiv.textContent = '您的登录已过期，请重新登录';
                errorDiv.classList.add('show');
                
                return true;
            }
            return false;
        }

        // 检查用户登录状态
        async function checkLoginStatus() {
            const savedToken = localStorage.getItem('access_token');
            const userInfo = localStorage.getItem('userInfo');
            
            if (savedToken && userInfo) {
                try {
                    const user = JSON.parse(userInfo);
                    // 自动登录
                    token = savedToken;
                    window.token = token;
                    
                    // 切换到聊天界面
                    document.getElementById('loginLayout').style.display = 'none';
                    document.getElementById('appLayout').style.display = 'flex';
                    
                    showUserInfo(user.username);
                    
                    // 加载会话列表
                    await loadConversations();
                    
                    // 连接WebSocket
                    connectWebSocket();
                    
                    return true;
                } catch (error) {
                    console.error('解析用户信息失败:', error);
                    localStorage.clear();
                }
            }
            return false;
        }

        // 显示登录表单
        function showLoginForm() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            clearErrors();
        }

        // 显示注册表单
        function showRegisterForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            clearErrors();
        }

        // 清除错误消息
        function clearErrors() {
            document.getElementById('loginError').classList.remove('show');
            document.getElementById('registerError').classList.remove('show');
            document.getElementById('registerSuccess').style.display = 'none';
        }

        // 验证用户名
        function validateUsername(username) {
            if (!username || username.length < 3 || username.length > 20) {
                return '用户名长度必须在3-20个字符之间';
            }
            if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                return '用户名只能包含字母、数字和下划线';
            }
            return null;
        }

        // 验证密码
        function validatePassword(password) {
            if (!password || password.length < 6) {
                return '密码长度至少6个字符';
            }
            return null;
        }

        // 用户注册
        async function register() {
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
            const errorDiv = document.getElementById('registerError');
            const successDiv = document.getElementById('registerSuccess');
            
            clearErrors();
            
            // 验证用户名
            const usernameError = validateUsername(username);
            if (usernameError) {
                errorDiv.textContent = usernameError;
                errorDiv.classList.add('show');
                return;
            }
            
            // 验证密码
            const passwordError = validatePassword(password);
            if (passwordError) {
                errorDiv.textContent = passwordError;
                errorDiv.classList.add('show');
                return;
            }
            
            // 验证密码确认
            if (password !== passwordConfirm) {
                errorDiv.textContent = '两次输入的密码不一致';
                errorDiv.classList.add('show');
                return;
            }
            
            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    successDiv.textContent = '✅ 注册成功！即将跳转到登录页面...';
                    successDiv.style.display = 'block';
                    
                    // 清空表单
                    document.getElementById('registerUsername').value = '';
                    document.getElementById('registerPassword').value = '';
                    document.getElementById('registerPasswordConfirm').value = '';
                    
                    // 2秒后跳转到登录页面
                    setTimeout(() => {
                        showLoginForm();
                        // 自动填充用户名
                        document.getElementById('loginUsername').value = username;
                    }, 2000);
                } else {
                    errorDiv.textContent = data.detail || '注册失败，请稍后重试';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = '网络错误: ' + error.message;
                errorDiv.classList.add('show');
            }
        }

        // 用户登录
        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            clearErrors();
            
            if (!username || !password) {
                errorDiv.textContent = '请输入用户名和密码';
                errorDiv.classList.add('show');
                return;
            }
            
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    token = data.access_token;
                    
                    // 保存用户信息到localStorage
                    localStorage.setItem('access_token', token);
                    localStorage.setItem('userInfo', JSON.stringify({
                        user_id: data.user_id,
                        username: data.username,
                        session_id: data.session_id
                    }));
                    
                    // 切换到聊天界面
                    document.getElementById('loginLayout').style.display = 'none';
                    document.getElementById('appLayout').style.display = 'flex';
                    
                    // 显示用户信息区域
                    showUserInfo(username);
                    
                    // 加载会话列表
                    await loadConversations();
                    
                    // 连接WebSocket
                    connectWebSocket();
                } else {
                    const data = await response.json();
                    errorDiv.textContent = data.detail || '登录失败';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = '网络错误: ' + error.message;
                errorDiv.classList.add('show');
            }
        }

        // 连接WebSocket
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const currentToken = token || window.token || localStorage.getItem('access_token');
            console.log('WebSocket连接token:', currentToken);
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/${currentToken}`);
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                displayMessage(data);
            };
            
            ws.onclose = function(event) {
                console.log('WebSocket连接关闭', event.code, event.reason);
                // 如果是认证失败导致的关闭（403），触发登出
                if (event.code === 1008 || event.reason.includes('403')) {
                    handleAuthError({ status: 403 });
                }
            };
            
            ws.onerror = function(error) {
                console.error('WebSocket错误:', error);
            };
        }

        // 存储当前正在流式输出的消息
        let currentStreamingMessage = null;
        
        // ==================== 会话管理功能 ====================
        
        // 加载会话列表
        async function loadConversations() {
            try {
                const response = await fetch('/conversations', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                // 检查认证错误
                if (handleAuthError(response)) {
                    return;
                }
                
                if (response.ok) {
                    const data = await response.json();
                    conversations = data.conversations || [];
                    renderConversationsList();
                    
                    // 不自动切换会话，让用户主动选择
                    console.log('✅ 已加载', conversations.length, '个历史会话');
                } else {
                    console.error('加载会话列表失败:', response.statusText);
                }
            } catch (error) {
                console.error('加载会话列表错误:', error);
            }
        }
        
        // 渲染会话列表
        function renderConversationsList() {
            const listContainer = document.getElementById('conversationsList');
            
            if (conversations.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-conversations">
                        <div class="empty-conversations-icon">💬</div>
                        <div>还没有对话记录</div>
                        <div style="font-size: 12px; margin-top: 5px;">点击上方按钮开始新对话</div>
                    </div>
                `;
            } else {
                // 按时间归类会话
                const groupedConversations = groupConversationsByTime(conversations);
                
                // 生成HTML
                let html = '';
                for (const [timeGroup, convs] of Object.entries(groupedConversations)) {
                    html += `
                        <div class="time-group">
                            <div class="time-group-header">${timeGroup}</div>
                            <div class="time-group-content">
                                ${convs.map(conv => {
                                    const isActive = conv.conversation_id === currentConversationId;
                                    const time = formatTime(conv.updated_at);
                                    
                                    return `
                                        <div class="conversation-item ${isActive ? 'active' : ''}" 
                                             onclick="switchConversation('${conv.conversation_id}')">
                                            <div class="conversation-title">${conv.title}</div>
                                            <div class="conversation-meta">
                                                <span class="conversation-time">${time}</span>
                                                <div style="display: flex; gap: 5px;">
                                                    <span class="conversation-delete" onclick="event.stopPropagation(); deleteConversation('${conv.conversation_id}')">🗑️</span>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }
                
                listContainer.innerHTML = html;
            }
        }
        
        // 按时间归类会话
        function groupConversationsByTime(conversations) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today.getTime() - 24 * 60 * 60 * 1000);
            const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
            const monthAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
            
            const groups = {};
            
            conversations.forEach(conv => {
                const convDate = new Date(conv.updated_at);
                const convDateOnly = new Date(convDate.getFullYear(), convDate.getMonth(), convDate.getDate());
                
                let timeGroup;
                
                if (convDateOnly.getTime() === today.getTime()) {
                    timeGroup = '今日';
                } else if (convDateOnly.getTime() === yesterday.getTime()) {
                    timeGroup = '昨日';
                } else if (convDate >= weekAgo) {
                    timeGroup = '7天内';
                } else if (convDate >= monthAgo) {
                    timeGroup = '30天内';
                } else {
                    // 按年月分组
                    const year = convDate.getFullYear();
                    const month = convDate.getMonth() + 1;
                    timeGroup = `${year}年${month}月`;
                }
                
                if (!groups[timeGroup]) {
                    groups[timeGroup] = [];
                }
                groups[timeGroup].push(conv);
            });
            
            // 按时间顺序排序分组
            const sortedGroups = {};
            const groupOrder = ['今日', '昨日', '7天内', '30天内'];
            
            // 先添加固定顺序的分组
            groupOrder.forEach(group => {
                if (groups[group]) {
                    sortedGroups[group] = groups[group];
                }
            });
            
            // 再添加年月分组（按时间倒序）
            const yearMonthGroups = Object.keys(groups)
                .filter(key => !groupOrder.includes(key))
                .sort((a, b) => {
                    const [yearA, monthA] = a.match(/(\d{4})年(\d{1,2})月/).slice(1).map(Number);
                    const [yearB, monthB] = b.match(/(\d{4})年(\d{1,2})月/).slice(1).map(Number);
                    
                    if (yearA !== yearB) return yearB - yearA;
                    return monthB - monthA;
                });
            
            yearMonthGroups.forEach(group => {
                sortedGroups[group] = groups[group];
            });
            
            return sortedGroups;
        }
        
        // 格式化时间
        function formatTime(isoString) {
            const date = new Date(isoString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return '刚刚';
            if (diffMins < 60) return `${diffMins}分钟前`;
            if (diffHours < 24) return `${diffHours}小时前`;
            if (diffDays < 7) return `${diffDays}天前`;
            
            return date.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
        }
        
        // 创建新会话
        async function createNewConversation() {
            try {
                const response = await fetch('/conversations', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title: '新对话' })
                });
                
                // 检查认证错误
                if (handleAuthError(response)) {
                    return;
                }
                
                if (response.ok) {
                    const data = await response.json();
                    currentConversationId = data.conversation_id;
                    
                    // 重新加载会话列表
                    await loadConversations();
                    
                    // 清空聊天窗口
                    document.getElementById('chatContainer').innerHTML = '';
                    document.getElementById('currentConversationTitle').textContent = '新对话';
                    
                    console.log('✅ 创建新会话:', currentConversationId);
                } else {
                    console.error('创建新会话失败:', response.statusText);
                }
            } catch (error) {
                console.error('创建新会话错误:', error);
            }
        }
        
        // 切换会话
        async function switchConversation(conversationId) {
            if (conversationId === currentConversationId) return;
            
            try {
                currentConversationId = conversationId;
                
                // 更新UI
                renderConversationsList();
                
                // 加载会话消息
                await loadConversationMessages(conversationId);
                
                // 更新标题
                const conversation = conversations.find(c => c.conversation_id === conversationId);
                if (conversation) {
                    document.getElementById('currentConversationTitle').textContent = conversation.title;
                }
                
                console.log('✅ 切换到会话:', conversationId);
            } catch (error) {
                console.error('切换会话错误:', error);
            }
        }
        
        // 加载会话消息
        async function loadConversationMessages(conversationId) {
            try {
                const response = await fetch(`/conversations/${conversationId}/messages`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                // 检查认证错误
                if (handleAuthError(response)) {
                    return;
                }
                
                if (response.ok) {
                    const data = await response.json();
                    const messages = data.messages || [];
                    
                    // 清空聊天窗口
                    const chatContainer = document.getElementById('chatContainer');
                    chatContainer.innerHTML = '';
                    
                    // 渲染历史消息
                    messages.forEach(msg => {
                        const messageDiv = document.createElement('div');
                        const messageClass = msg.role === 'user' ? 'user-message' : 'assistant-message';
                        messageDiv.className = `message ${messageClass}`;
                        messageDiv.innerHTML = `
                            <div class="message-content">${msg.content}</div>
                            <small class="message-time">${new Date(msg.timestamp).toLocaleTimeString()}</small>
                        `;
                        chatContainer.appendChild(messageDiv);
                    });
                    
                    // 滚动到底部
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    
                    console.log('✅ 加载了', messages.length, '条历史消息');
                } else {
                    console.error('加载会话消息失败:', response.statusText);
                }
            } catch (error) {
                console.error('加载会话消息错误:', error);
            }
        }
        
        // 删除会话
        async function deleteConversation(conversationId) {
            if (!confirm('确定要删除这个会话吗？')) return;
            
            try {
                const response = await fetch(`/conversations/${conversationId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                // 检查认证错误
                if (handleAuthError(response)) {
                    return;
                }
                
                if (response.ok) {
                    // 如果删除的是当前会话，创建新会话
                    if (conversationId === currentConversationId) {
                        await createNewConversation();
                    }
                    
                    // 重新加载会话列表
                    await loadConversations();
                    
                    console.log('✅ 删除会话:', conversationId);
                } else {
                    console.error('删除会话失败:', response.statusText);
                }
            } catch (error) {
                console.error('删除会话错误:', error);
            }
        }
        
        // 显示消息
        function displayMessage(data) {
            const chatContainer = document.getElementById('chatContainer');
            
            if (data.type === 'title_updated') {
                // 处理标题更新
                const conversation = conversations.find(c => c.conversation_id === data.conversation_id);
                if (conversation) {
                    conversation.title = data.title;
                    renderConversationsList();
                    
                    // 如果是当前会话，更新标题显示
                    if (data.conversation_id === currentConversationId) {
                        document.getElementById('currentConversationTitle').textContent = data.title;
                    }
                }
                console.log('✅ 标题已更新:', data.title);
                
            } else if (data.type === 'thinking') {
                // 🆕 处理思考过程消息（中间过程）
                const thinkingDiv = document.createElement('div');
                thinkingDiv.className = 'message thinking-message';
                thinkingDiv.id = 'thinking-' + data.message_id;
                thinkingDiv.innerHTML = `
                    <div class="message-content">${data.content}</div>
                    <small class="message-time">${new Date(data.timestamp).toLocaleTimeString()}</small>
                `;
                chatContainer.appendChild(thinkingDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
            } else if (data.type === 'final_answer_start') {
                // 🆕 最终回答开始标记 - 不做任何处理，只是标记
                console.log('📝 开始接收最终回答');
                
            } else if (data.type === 'hide_thinking') {
                // 隐藏"正在思考..."消息（兼容旧逻辑）
                const thinkingElement = document.getElementById('thinking-' + data.message_id) || document.getElementById('status-' + data.message_id);
                if (thinkingElement) {
                    thinkingElement.style.display = 'none';
                }
                
            } else if (data.type === 'message_chunk') {
                // 处理流式消息块（最终回答）
                if (!currentStreamingMessage) {
                    // 创建新的流式消息容器 - 使用final-answer样式
                    currentStreamingMessage = document.createElement('div');
                    currentStreamingMessage.className = 'message final-answer';
                    currentStreamingMessage.id = 'streaming-' + data.message_id;
                    currentStreamingMessage.innerHTML = `
                        <div class="message-content"></div>
                        <small class="message-time">${new Date(data.timestamp).toLocaleTimeString()}</small>
                    `;
                    chatContainer.appendChild(currentStreamingMessage);
                }
                
                // 更新内容
                const contentDiv = currentStreamingMessage.querySelector('.message-content');
                
                // 检查是否需要替换内容（工具调用后重新生成）
                if (data.metadata && data.metadata.replace) {
                    // 完全替换内容，不追加
                    contentDiv.textContent = data.full_content;
                } else {
                    // 追加或更新内容
                    contentDiv.textContent = data.full_content;
                }
                
                // 滚动到底部
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
            } else if (data.type === 'message') {
                // 处理完整消息
                if (currentStreamingMessage) {
                    currentStreamingMessage = null;
                }
                
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message assistant-message';
                messageDiv.innerHTML = `
                    <div class="message-content">${data.content}</div>
                    <small class="message-time">${new Date(data.timestamp).toLocaleTimeString()}</small>
                `;
                
                chatContainer.appendChild(messageDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
            } else if (data.type === 'status') {
                // 处理状态消息
                if (data.content === '完成' && currentStreamingMessage) {
                    currentStreamingMessage = null;
                } else if (data.content !== '完成') {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message status';
                    messageDiv.id = 'status-' + (data.message_id || 'default');
                    messageDiv.innerHTML = `
                        <div class="message-content">${data.content}</div>
                        <small class="message-time">${new Date(data.timestamp).toLocaleTimeString()}</small>
                    `;
                    
                    chatContainer.appendChild(messageDiv);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
                
            } else if (data.type === 'error') {
                // 处理错误消息
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message error';
                messageDiv.innerHTML = `
                    <div class="message-content">❌ ${data.content}</div>
                    <small class="message-time">${new Date(data.timestamp).toLocaleTimeString()}</small>
                `;
                
                chatContainer.appendChild(messageDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        // 发送消息
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message && ws) {
                // 如果没有当前会话，先创建一个（这种情况理论上不应该发生）
                if (!currentConversationId) {
                    console.warn('没有当前会话，正在创建新会话...');
                    createNewConversation().then(() => {
                        sendMessageInternal(message, input);
                    });
                    return;
                }
                
                sendMessageInternal(message, input);
            }
        }
        
        // 内部发送消息函数
        function sendMessageInternal(message, input) {
            if (message && ws) {
                // 显示用户消息
                const chatContainer = document.getElementById('chatContainer');
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message user-message';
                messageDiv.innerHTML = `
                    <div class="message-content">${message}</div>
                    <small class="message-time">${new Date().toLocaleTimeString()}</small>
                `;
                chatContainer.appendChild(messageDiv);
                
                // 发送消息，包含会话ID
                ws.send(JSON.stringify({ 
                    content: message,
                    conversation_id: currentConversationId
                }));
                input.value = '';
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        // 处理回车键
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 显示用户信息
        function showUserInfo(username) {
            const userInfo = document.getElementById('userInfo');
            const userAvatar = document.getElementById('userAvatar');
            const userName = document.getElementById('userName');
            
            // 设置用户头像（取用户名首字母）
            userAvatar.textContent = username.charAt(0).toUpperCase();
            userName.textContent = username;
            
            // 显示用户信息区域
            userInfo.style.display = 'flex';
        }

        // 新标签页打开日历管理（外部日历前端）
        async function openTodoPage() {
            try {
                // 先获取用户的calendar_user_id
                const response = await fetch('/user/calendar-id', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                // 检查认证错误
                if (handleAuthError(response)) {
                    return;
                }
                
                if (response.ok) {
                    const data = await response.json();
                    // 确保calendar_user_id作为字符串使用，避免JavaScript精度丢失
                    // JavaScript的Number类型只能安全表示到Number.MAX_SAFE_INTEGER (9007199254740991)
                    const calendarUserId = String(data.calendar_user_id);
                    
                    console.log('📅 打开日历页面，userId:', calendarUserId, '类型:', typeof calendarUserId);
                    
                    // 直接打开外部日历前端
                    const calendarUrl = `http://tyqy.duckdns.org:8980/?userId=${calendarUserId}`;
                    const calendarWindow = window.open(calendarUrl, '_blank');
                    
                    // 检查是否成功打开新窗口
                    if (!calendarWindow || calendarWindow.closed || typeof calendarWindow.closed == 'undefined') {
                        alert('无法打开新窗口，请检查浏览器弹窗设置');
                    }
                } else {
                    const errorData = await response.json();
                    alert('获取日历用户ID失败: ' + (errorData.detail || '未知错误'));
                }
            } catch (error) {
                console.error('打开日历页面失败:', error);
                alert('打开日历页面失败: ' + error.message);
            }
        }

        // 页面加载时检查登录状态
        document.addEventListener('DOMContentLoaded', function() {
            if (!checkLoginStatus()) {
                // 如果没有登录，显示登录表单
                document.getElementById('loginForm').style.display = 'block';
            }
        });

        // 登出
        async function logout() {
            if (ws) {
                ws.close();
            }
            
            if (token) {
                try {
                    await fetch('/auth/logout', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                } catch (error) {
                    console.error('登出错误:', error);
                }
            }
            
            token = null;
            
            // 清理localStorage
            localStorage.removeItem('access_token');
            localStorage.removeItem('userInfo');
            
            // 清理状态
            currentConversationId = null;
            conversations = [];
            
            // 切换到登录界面
            document.getElementById('appLayout').style.display = 'none';
            document.getElementById('loginLayout').style.display = 'block';
            
            // 清空聊天窗口
            document.getElementById('chatContainer').innerHTML = '';
        }
    </script>
</body>
</html>
