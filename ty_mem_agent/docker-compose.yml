version: '3.8'

services:
  ty-mem-agent:
    build:
      context: ..
      dockerfile: ty_mem_agent/Dockerfile
    container_name: ty-memory-agent
    restart: unless-stopped
    
    # 使用 host 网络模式（仅 Linux 支持）
    # 优点：
    # 1. 性能最好，无网络隔离
    # 2. 直接访问宿主机服务（localhost:18091）
    # 3. 避免子网冲突问题
    # 4. 外部直接通过 <主机IP>:10081 访问
    network_mode: host
    
    # 环境变量：从 .env 文件加载
    env_file:
      - .env
    
    # 如果使用了宿主机的日历MCP服务，需要配置访问地址
    # Host 网络模式下，容器内 localhost = 宿主机 localhost
    environment:
      - CALENDAR_MCP_SERVER_URL=${CALENDAR_MCP_SERVER_URL:-http://localhost:18091/mcp}
    
    volumes:
      # 挂载配置文件
      - ./config:/app/ty_mem_agent/config
      # 挂载数据目录（持久化数据库和用户数据）
      - ./data:/app/ty_mem_agent/data
      # 挂载日志目录（持久化日志）
      - ./logs:/app/ty_mem_agent/logs
      # 挂载工作空间
      - ./workspace:/app/ty_mem_agent/workspace
      # 挂载环境变量文件（如果需要在容器内读取）
      - ./.env:/app/ty_mem_agent/.env:ro
      
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# 备选方案：使用 host 网络模式（仅在 Linux 系统上推荐）
